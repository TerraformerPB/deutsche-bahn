# Beispielkonfiguration nginx – Reverse-Proxy mit TLS vor der DB-ICE-Live-Karte
# Anpassen: Domain, Zertifikatspfade, ggf. Rate-Limits. In .env: TRUST_PROXY=1

limit_req_zone $binary_remote_addr zone=dbkarte_api:10m rate=3r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bahn.paulbartsch.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bahn.paulbartsch.de;

    ssl_certificate     /etc/letsencrypt/live/bahn.paulbartsch.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bahn.paulbartsch.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:dbkarte_ssl:10m;

    # HSTS hier ODER per HSTS_ENABLED=true in der App – nicht doppelt
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Zugriffsprotokoll mit anonymisierter IP (Datenschutz): siehe map-Block unten
    access_log /var/log/nginx/dbkarte.access.log anonymized;
    error_log  /var/log/nginx/dbkarte.error.log warn;

    gzip on;
    gzip_types application/json text/javascript application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=dbkarte_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/dbkarte-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/dbkarte-proxy.conf;
    }
}

